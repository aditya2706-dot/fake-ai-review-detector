[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fake-review-detector"
version = "0.1.0"
description = "Detects paid, incentivised, and machine-generated e-commerce reviews"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "joblib>=1.4",
    "matplotlib>=3.9",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.9",
]

[project.optional-dependencies]
# LightGBM needs OpenMP at runtime (`brew install libomp` on macOS). The
# project falls back to sklearn's HistGradientBoosting automatically if the
# native library will not load, so this is genuinely optional.
boost = ["lightgbm>=4.5"]
# Transformer stage. Large download; only needed for `frd.models.transformer`.
deep = ["torch>=2.2", "transformers>=4.44", "datasets>=2.20"]
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
frd-dataset = "frd.cli.make_dataset:main"
frd-train = "frd.cli.train:main"
frd-score = "frd.cli.score:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 88
target-version = "py310"
